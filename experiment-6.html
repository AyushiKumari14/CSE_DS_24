<!-- CSS selectors (class, id and pseudo-classes) -->

<!DOCTYPE html>
<html>

<head>
    <title>CSS Selectors</title>

    <style>
        h1 {
            color: rgb(125, 125, 240);
        }


        .box {
            background-color: rgb(215, 215, 133);
            padding: 15px;
        }


        #para {
            color: red;
        }

        a:hover {
            color: green;
        }
    </style>

</head>

<body>

    <h1>CSS Selectors</h1>

    <div class="box">
        This is class selector.
    </div>

    <p id="para">This is ID selector.</p>

    <a href="#">Move mouse over here</a>


    <button>Click Me</button>

</body>

</html>
