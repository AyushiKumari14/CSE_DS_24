<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Video and Iframe</title>
</head>

<body>
    <table border="4" align="center">
        <tr>

            <td>
                <audio src="audio.mp3"></audio>
                Audio
            </td>

            <td>
                <video src="video.mp4" width="250"></video>
                Video
            </td>

            <td>
                <iframe src="https://example.org" width="300" height="200">
                </iframe>
            </td>
        </tr>
    </table>

</body>

</html>
