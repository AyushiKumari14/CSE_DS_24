<!-- JavaScript program using variables, data types and operators -->

<!DOCTYPE html>
<html>

<head>
    <title>JavaScript</title>
</head>

<body>

    <h2>JavaScript variables</h2>

    <script>
        let name = "Ayushi";
        let age = 20;
        let marks = 85.5;
        let passed = true;

        let a = 10;
        let b = 5;

        document.write("Name: " + name ); 
        document.write(" Age: " + age );
        document.write(" Marks: " + marks );
        document.write(" Passed: " + passed );

        document.write(" Addition: " + (a + b) );
        document.write(" Subtraction: " + (a - b) );
        document.write(" Multiplication: " + (a * b) );
        document.write(" Division: " + (a / b));
    </script>

</body>

</html>
