<!-- Apply inline, internal and external CSS in one page -->

<!DOCTYPE html>
<html>

<head>
    <title>CSS Methods</title>

    <!-- Internal CSS -->
    <style>
        h2 {
            color: blue;
            text-align: center;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Inline CSS -->
    <h1 style="color:red;">Welcome to CSS</h1>

    <h2>This is Internal CSS</h2>

    <p>This paragraph uses External CSS.</p>

</body>

</html>
