<!-- Create and use functions in JavaScript -->


<!DOCTYPE html>
<html>

<head>
    <title>Js functions</title>
</head>

<body>

    <h2>Functions in Javascript</h2>

    <script>
        function add(a, b) {
            return a + b;
        }

        function display() {
            document.write("Welcome to JavaScript<br>");
        }

        display();

        let result = add(10, 20);

        document.write("Addition = " + result);
    </script>

</body>

</html>
