<!-- JavaScript control structures (if-else and loops) -->

<!DOCTYPE html>
<html>

<head>
    <title>Control statement</title>
</head>

<body>

    <h2>JavaScript Control Statements</h2>

    <script>
        let marks = 75;

        if (marks >= 40) {
            document.write("Student is pass<br>");
        }
        else {
            document.write("Student is fail<br>");
        }

        document.write("<br>For Loop- <br>");

        for (let i = 1; i <= 5; i++) {
            document.write(i + "<br>");
        }

        document.write("<br>While Loop:- <br>");

        let j = 1;

        while (j <= 5) {
            document.write(j + "<br>");
            j++;
        }
    </script>

</body>

</html>
