<!-- DOM manipulation to change content and styles dynamically -->

<!DOCTYPE html>
<html>

<head>
    <title>DOM Manipulation</title>
</head>

<body>

    <h2 id="heading">Hello Student</h2>

    <p id="para">This is the original paragraph.</p>

    <button onclick="changeText()">Change Content</button>

    <script>
        function changeText() {

            document.getElementById("heading").innerHTML =
                "Welcome to JavaScript";

            document.getElementById("para").innerHTML =
                "The content has been changed.";

            document.getElementById("para").style.color = "blue";
            document.getElementById("para").style.fontSize = "20px";
        }
    </script>

</body>

</html>
