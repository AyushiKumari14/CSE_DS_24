<!-- 
Apply CSS using inline, internal, and external methods in one page. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .boxmodel {
            width: 260px;
            padding: 25px;
            border: 10px solid #184276;
            margin: 25px;
            background: #fef3c7;
            text-align: center;
            text-transform: uppercase;


        }

        .textdemo {
            text-align: center;
            text-transform: uppercase;
            text-decoration: underline;
            font-style: italic;

        }

        .fontdemo {
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 26px;
            font-style: italic;
            font-weight: bold;

        }
    </style>
</head>

<body style="background-color: rgb(255, 229, 142);">
    <p class="textdemo" align="center">css makes text easy to style</p>
    <div class="boxmodel" align="center">content</div>
    <p class="fontdemo" align="center">css font example</p>

</body>

</html>
