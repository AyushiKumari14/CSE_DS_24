<!-- Design a webpage using tables and include multimedia elements like audio, video, and iframe. -->

<!DOCTYPE html>
<html>

<head>
    <title>Table and Multimedia</title>
</head>

<body>

    <h1>Student Information</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>Name</th>
            <th>Branch</th>
            <th>Semester</th>
        </tr>

        <tr>
            <td>Ayushi</td>
            <td>Data Science</td>
            <td>3rd</td>
        </tr>

        <tr>
            <td>Riya</td>
            <td>CSE</td>
            <td>3rd</td>
        </tr>
    </table>

    <h2>Audio</h2>
    <audio controls>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <h2>Video</h2>
    <video width="300" controls>
        <source src="video.mp4" type="video/mp4">
    </video>

    <h2>Iframe</h2>
    <iframe src="https://www.wikipedia.org" width="400" height="250">
    </iframe>

</body>

</html>
