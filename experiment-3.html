<!-- Structure a webpage using semantic HTML5 tags. -->

<!DOCTYPE html>
<html>

<head>
    <title>Semantic HTML</title>
</head>

<body>

    <header>
        <h1>My Website</h1>
        <p>Welcome to my website</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <main>
        <section>
            <h2>About HTML</h2>
            <p>HTML is used to create webpages.</p>
        </section>

        <article>
            <h2>Web Technology</h2>
            <p>HTML, CSS and JavaScript are used in web development.</p>
        </article>

        <aside>
            <h3>Other Information</h3>
            <p>Learn more about web development.</p>
        </aside>
    </main>

    <footer>
        <p>Copyright 2026 My Website</p>
    </footer>

</body>

</html>
